name: prose

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-duplicate-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scoped to panel, which is clean. The rest of the repo currently has 18 duplications;
      # widening this gate means fixing those first. A gate that declares its scope is honest —
      # a gate quietly narrowed to stay green is not.
      - name: No sentence appears twice
        run: |
          bash bin/no-duplicate-prose.sh \
            plugins/panel/README.md \
            plugins/panel/skills/*/SKILL.md \
            plugins/panel/skills/*/examples.md \
            plugins/panel/agents/*.md
