name: gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ordered by what reaches a user. A component whose frontmatter is wrong registers
      # wrong for everyone who installs it, and it does so silently — the harness falls back
      # to the directory name and scrapes a description from the first blockquote.
      - name: Every component carries registering frontmatter
        run: bash bin/frontmatter.sh

      - name: The manifest agrees with every plugin
        run: bash bin/versions.sh

      # A meta-check, and not one of the ten. It grades them, so counting it among them would make the
      # set it checks disagree with itself. `panel` was advertised and unrun for days.
      - name: The documents, the workflow and every harness file agree
        run: sh bin/agree.sh

      - name: And that check can fail
        run: sh bin/agree.sh audit

      # No arguments. The scope is `repeats.sh`'s own DEBT list and nothing else, because a file
      # list here was a second declaration of the same thing — and the two had drifted.
      #
      # Measured 2026-08-25: a sentence copied from README into CONTRIBUTING turned a bare run red
      # and this step green. Neither file was in the list. `agree` cannot see it: it holds the two
      # to the same *gates*, never to the same arguments.
      #
      # This blocks verbatim duplication, which is the *precondition* of drift, not drift
      # itself. Once two statements of a rule differ by one word, separating intentional
      # variation from drift needs semantics, and no exit code can do it.
      - name: No sentence appears twice
        run: bash bin/repeats.sh

      # Two craft-sh rules that only human attention held. Both were caught by hand three times in
      # one day, which is the moment a judgement becomes an exit code.
      #
      # The length half gates a number; craft-sh's rule is a signal no exit code reads. bin/shell.sh
      # says which is which, and names the two bodies already past the number.
      - name: Shipped shell reads down, not sideways
        run: bash bin/shell.sh

      # Every first-party comment, tests and awk included. The old check read ten blocks and
      # skipped four hundred and eighty-two, so #369 and #398 are what this closes.
      - name: Comment paragraphs narrow by three
        run: sh bin/taper.sh

      - name: The taper gate can go red
        run: sh bin/taper.sh audit

      # The seam renders a public comment from fields; this proves the audit that reads the thread
      # back and re-runs those rules on what landed. The audit itself needs `gh` and the network, so
      # what runs here is its suite, driven through a `gh` the suite writes.
      - name: A comment through the seam still obeys it
        run: sh bin/comments.sh audit

      # The adapter that reaches a judge, driven through a `codex` its suite writes. Four faults in
      # its readers were found by a judge rather than a check, so this line exists. No network.
      - name: The adapter answers for itself
        run: sh bin/judge.sh audit

  # The gates above read files. This one runs the plugins that ship code, on each operating system a
  # user installs them on, because that is where both of them broke last: signal's hook was not
  # executable, so it died before reading a word, and kernel's nine hooks named a bare path with no
  # interpreter, which needs the same bit Windows does not record. Nothing here noticed either.
  #
  # Three runners, not one, and the differences between them are the point. Ubuntu resolves `awk` to
  # mawk and `sh` to dash — it is the only runner that can fail a bashism, because `sh` on macOS and
  # under Git Bash *is* bash and accepts `&>`, `[[ =~ ]]` and `${BASH_SOURCE[0]}` without complaint.
  # macOS brings BSD awk. Windows runs `shell: bash`, which is the same Git Bash Claude Code starts
  # there, and is the only runner that records no executable bit. A suite that met one of these
  # would keep passing code the other two cannot run.
  #
  # Each plugin is its own job so a red square names the plugin, not just the platform.
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        plugin: [kernel, signal, floor, panel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: The tools ${{ matrix.plugin }} claims to need
        run: |
          command -v sh   && sh -c 'echo sh ok'
          command -v awk  && echo 'a b' | awk '{ print "awk ok" }'
          # floor needs git rather than awk — it finds the active run through the git directory.
          command -v git  && git --version
          # Which sh this runner has, printed so a skipped bashism audit can be read back later.
          # dash lets the output escape; bash sends it to /dev/null.
          [ -z "$(sh -c 'echo leak &>/dev/null' 2>/dev/null)" ] \
            && echo 'sh is bash — bashism audits will skip here' \
            || echo 'sh is not bash — bashism audits will run here'

      - name: ${{ matrix.plugin }} runs, and its suite can still go red
        run: bash plugins/${{ matrix.plugin }}/tests/run.sh
