name: prose

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repeats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enforced where the repo is already clean. kernel, laravel-ddd and laravel-playbook
      # still carry repeats; the next step reports them rather than gating on them, until
      # they are fixed. A gate that declares its scope is honest — a gate quietly narrowed
      # to stay green is not.
      - name: No sentence appears twice — enforced
        run: bash bin/repeats.sh $(git ls-files 'plugins/panel/*.md' 'plugins/pest/*.md')

      - name: Repeats across the rest of the repo — reported
        continue-on-error: true
        run: bash bin/repeats.sh
