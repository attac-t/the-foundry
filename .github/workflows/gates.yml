name: gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ordered by what reaches a user. A component whose frontmatter is wrong registers
      # wrong for everyone who installs it, and it does so silently — the harness falls back
      # to the directory name and scrapes a description from the first blockquote.
      - name: Every component carries registering frontmatter
        run: bash bin/frontmatter.sh

      - name: The manifest agrees with every plugin
        run: bash bin/versions.sh

      # Enforced on the two plugins that are clean. kernel, laravel-ddd and laravel-playbook
      # carry 18 repeats between them; widening this gate means fixing those first. A gate
      # that declares its scope is honest — a gate quietly narrowed to stay green is not.
      #
      # This blocks verbatim duplication, which is the *precondition* of drift, not drift
      # itself. Once two statements of a rule differ by one word, separating intentional
      # variation from drift needs semantics, and no exit code can do it.
      - name: No sentence appears twice
        run: bash bin/repeats.sh $(git ls-files -co --exclude-standard 'plugins/panel/*.md' 'plugins/pest/*.md')

      # A judge that can write what it judges may have written what it approves. These two are
      # the deliverable of the "judges are peers" charter and the promotion its own verdict
      # asked for — reaching the README's copy-paste line and not this file left them running
      # only when someone remembered, which is the failure the promotion exists to remove.
      - name: judges.sh still rejects what it should reject
        run: bash plugins/panel/tests/judges.test.sh

      - name: This repo's charter seats no judge that can write
        run: bash plugins/panel/bin/judges.sh

      # Kept out of panel's own suite on purpose. Panel installs standalone, so nothing shipped
      # inside it may assert that pest is present — a suite that needs a second plugin fails for
      # most of the people who run it. That a stack plugin seats an eligible judge is a fact about
      # this monorepo, so the monorepo checks it.
      - name: A stack plugin still seats an eligible judge
        run: bash plugins/panel/bin/judges.sh plugins/panel/tests/fixtures/pest-critic.md
